; Home Energy Manager panel - PlatformIO project.
;
; Hardware: Waveshare ESP32-S3-Touch-LCD-7 (800x480 ST7262 RGB, GT911 touch,
; 16 MB flash / 8 MB PSRAM).
;
; Stack: Arduino-ESP32 core 3.x + esp_lcd RGB panel + LVGL 9 + WiFiManager.
; The desktop emulator (sim/) builds the same src/warp and src/ui sources.

[platformio]
description = Home Energy Manager panel (Waveshare ESP32-S3-Touch-LCD-7)
default_envs = esp32-s3-touch-lcd-7

[env]
framework = arduino
platform = espressif32@6.8.0
monitor_speed = 115200
lib_deps =
	tzapu/WiFiManager@^2.0.17
	lvgl/lvgl@9.3.0
; Writes include/BuildStamp.h before every build: the tag on a tagged commit,
; the short commit otherwise, and -dirty when the tree has changes. The panel
; shows it in the web portal.
extra_scripts = pre:tools/build_stamp.py
; Add -DHEMS_UI_DEBUG_BAND=1 to build_flags to log the price-band segment
; geometry while tuning the chart, and -DHEMS_DIAG=1 for the five-second
; display heartbeat (refresh, flush and heap numbers). Both are off by default
; so the panel's log stays quiet and the UART does not stall the UI.
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
	-I include
	-I src
; The framework compiles everything with -Os. The project's own sources are
; the ones that format labels, rebuild the chart and resample the history, so
; they get -O2; LVGL and the SDK stay at -Os to keep the image small.
build_src_flags =
	-O2

[env:esp32-s3-touch-lcd-7]
board = waveshare-esp32-s3-touch-lcd-7
board_build.partitions = partitions/16mb_app.csv
build_flags =
	${env.build_flags}
	-DWARP_BOARD_WAVESHARE_TOUCH_LCD7

; English UI build: same firmware, UI strings in English (compile-time,
; see TR() in src/ui/HemsUi.cpp). German stays the default.
[env:esp32-s3-touch-lcd-7-en]
extends = env:esp32-s3-touch-lcd-7
build_flags =
	${env:esp32-s3-touch-lcd-7.build_flags}
	-DWARP_LANG_EN=1
