; Home Energy Manager panel - PlatformIO project.
;
; Hardware: Waveshare ESP32-S3-Touch-LCD-7 (800x480 ST7262 RGB, GT911 touch,
; 16 MB flash / 8 MB PSRAM).
;
; Stack: Arduino-ESP32 core 3.x + esp_lcd RGB panel + LVGL 9 + WiFiManager.
; The desktop emulator (sim/) builds the same src/warp and src/ui sources.

[platformio]
description = Home Energy Manager panel (Waveshare ESP32-S3-Touch-LCD-7)
default_envs = esp32-s3-touch-lcd-7

[env]
framework = arduino
platform = espressif32@6.8.0
monitor_speed = 115200
lib_deps =
	tzapu/WiFiManager@^2.0.17
	lvgl/lvgl@9.3.0
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
	-I include
	-I src

[env:esp32-s3-touch-lcd-7]
board = waveshare-esp32-s3-touch-lcd-7
board_build.partitions = partitions/16mb_app.csv
build_flags =
	${env.build_flags}
	-DWARP_BOARD_WAVESHARE_TOUCH_LCD7

; Factory board: the trace between EXIO2 and the backlight enable is intact, so
; GPIO 6 must stay out of that net and the light is switched through EXIO2.
; This is a different image, not a runtime setting - see Pins.h.
[env:esp32-s3-touch-lcd-7-factory]
extends = env:esp32-s3-touch-lcd-7
build_flags =
	${env:esp32-s3-touch-lcd-7.build_flags}
	-DBOARD_CH422G_LCD_DISP_CUT=0

; English UI build: same firmware, UI strings in English (compile-time,
; see TR() in src/ui/WarpUi.cpp). German stays the default.
[env:esp32-s3-touch-lcd-7-en]
extends = env:esp32-s3-touch-lcd-7
build_flags =
	${env:esp32-s3-touch-lcd-7.build_flags}
	-DWARP_LANG_EN=1

[env:esp32-s3-touch-lcd-7-factory-en]
extends = env:esp32-s3-touch-lcd-7-factory
build_flags =
	${env:esp32-s3-touch-lcd-7-factory.build_flags}
	-DWARP_LANG_EN=1
